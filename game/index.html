<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#05070a" />
    <meta name="description" content="Apex Island — a browser battle royale built with Three.js. Drop, loot, fight, survive." />
    <title>Apex Island — Tactical Battle Royale</title>
    <style>
      html, body { margin: 0; background: #05070a; color: #e6edf3; font-family: 'Rajdhani', 'Segoe UI', sans-serif; }
      #app { position: fixed; inset: 0; overflow: hidden; }
      canvas#view { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
      #boot-error {
        position: absolute; inset: 0; display: none; align-items: center; justify-content: center;
        padding: 32px; background: #05070a; z-index: 100; text-align: center;
      }
      #boot-error div { max-width: 620px; }
      #boot-error h1 { letter-spacing: 4px; font-size: 22px; }
      #boot-error p { color: #93a4b5; line-height: 1.7; font-size: 15px; }
      #boot-error code { font-family: ui-monospace, Menlo, monospace; font-size: 13px; color: #ffb347; }
    </style>
  </head>
  <body>
    <div id="app">
      <canvas id="view" tabindex="0"></canvas>
      <div id="boot-error">
        <div>
          <h1>APEX ISLAND COULD NOT START</h1>
          <p id="boot-error-msg">An unexpected error occurred while loading the game.</p>
          <p>The game needs WebGL2. Try updating your browser or enabling hardware acceleration, then reload.</p>
          <p><code id="boot-error-detail"></code></p>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
