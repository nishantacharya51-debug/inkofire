name: Deploy Apex Island to GitHub Pages

# Builds the game (game/ -> Vite) and publishes it with GitHub Pages.
# Free for public repositories — no paid plan or external host needed.

on:
  push:
    branches:
      - main
      - arena/01a0ddb9-secretnishantfwh
  # Allows the deployment to be triggered by hand from the Actions tab.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build the game
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: game/package-lock.json

      - name: Install dependencies
        working-directory: game
        run: npm ci

      - name: Typecheck and build
        working-directory: game
        run: npm run build

      # Keep the page that used to be served from this repository reachable
      # under /ict/ instead of silently dropping it.
      - name: Preserve the previous site under /ict
        run: |
          mkdir -p game/dist/ict
          if git fetch --depth=1 origin nishantacharya.calling; then
            git show FETCH_HEAD:index.html > game/dist/ict/index.html 2>/dev/null || true
            git show FETCH_HEAD:nishant.html > game/dist/ict/nishant.html 2>/dev/null || true
          fi
          ls -la game/dist/ict

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: game/dist

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
