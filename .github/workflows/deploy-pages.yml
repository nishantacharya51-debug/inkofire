name: Deploy Apex Island to GitHub Pages

# Builds the game (game/ -> Vite) and publishes it with GitHub Pages.
# Free for public repositories — no paid plan or external host needed.

on:
  push:
    branches:
      - main
      - arena/01a0ddb9-secretnishantfwh
  # Allows the deployment to be triggered by hand from the Actions tab.
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build the game
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: game/package-lock.json

      - name: Install dependencies
        working-directory: game
        run: npm ci

      - name: Typecheck and build
        working-directory: game
        run: npm run build

      # Keep the page that used to be served from this repository reachable
      # under /ict/ instead of silently dropping it.
      - name: Preserve the previous site under /ict
        run: |
          mkdir -p game/dist/ict
          if git fetch --depth=1 origin nishantacharya.calling; then
            git show FETCH_HEAD:index.html > game/dist/ict/index.html 2>/dev/null || true
            git show FETCH_HEAD:nishant.html > game/dist/ict/nishant.html 2>/dev/null || true
          fi
          ls -la game/dist/ict

      # GitHub Pages on this repository is configured to publish the branch
      # itself ("legacy" source), so also keep a ready-to-serve copy in /play.
      # This makes the game reachable at <site>/play/ even before the Pages
      # source is switched to "GitHub Actions".
      - name: Sync the built game to /play
        if: github.event_name == 'push'
        run: |
          rm -rf play
          cp -r game/dist play
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A play .nojekyll
          if git diff --cached --quiet; then
            echo "no changes to publish"
          else
            git commit -m "Publish game build to /play"
            git push
          fi

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: game/dist

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
